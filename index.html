<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NanoShahar — Toshkentda o'z uyingni ol</title>
<meta name="description" content="Toshkentning virtual xaritasi: izoh qoldir va o'z uyingni ol. Bizneslar uchun — osmono'par bino.">
<meta name="theme-color" content="#1F4E8C">
<meta property="og:title" content="NanoShahar — virtual Toshkent">
<meta property="og:description" content="Haqiqiy Toshkent xaritasida o'z uyingni ol">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="map" aria-label="Toshkent xaritasi"></canvas>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V9l4-3v15"/><path d="M9 21V4h6v17"/><path d="M15 21V10l4 2v9"/></svg>
    </div>
    <div>
      <div class="title">NANOSHAHAR</div>
      <div class="sub" id="stats">…</div>
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btnSearch" aria-label="Qidirish">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="lang" id="btnLang">RU</button>
  </div>
</header>

<div class="zoom">
  <button class="icon-btn" id="zIn" aria-label="Yaqinlashtirish">+</button>
  <button class="icon-btn" id="zOut" aria-label="Uzoqlashtirish">−</button>
  <button class="icon-btn" id="zTilt" aria-label="3D" style="font-size:14px;font-weight:800;color:#1F4E8C">3D</button>
  <button class="icon-btn" id="zHome" aria-label="Butun shahar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<div class="cta">
  <button class="primary" id="btnClaim" data-t="claim_btn">Uyimni olish — bepul</button>
  <button class="secondary" id="btnBuy" data-t="buy_btn">Joy sotib olish</button>
</div>

<div class="attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet-backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="grab"></div>
  <button class="close" id="sheetClose" aria-label="Yopish">×</button>
  <div id="sheetBody"></div>
</section>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
